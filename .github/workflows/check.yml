name: Source checks
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: assets/remotion
      - run: npm run typecheck && npm test
        working-directory: assets/remotion
      - run: python3 -m py_compile scripts/init.py scripts/install.py
